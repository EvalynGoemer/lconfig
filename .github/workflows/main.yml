name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get Deps
      run: |
        [ -z "$(git tag --points-at HEAD --list '????-??-??')" ] || exit 0
        sudo apt-get update && sudo apt-get install -y musl-tools
        rustup target add x86_64-unknown-linux-musl

    - name: Build
      env:
        CC_x86_64_unknown_linux_musl: musl-gcc
      run: |
        [ -z "$(git tag --points-at HEAD --list '????-??-??')" ] || exit 0
        cargo build --release --locked --target x86_64-unknown-linux-musl

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        [ -z "$(git tag --points-at HEAD --list '????-??-??')" ] || exit 0

        mv target/x86_64-unknown-linux-musl/release/lconfig lconfig-linux-x86_64

        tag="$(date -u +%Y-%m-%d)"
        gh release create "$tag" lconfig-linux-x86_64 \
          --title "$tag"                              \
          --target "$GITHUB_SHA"                      \
          --prerelease                                \
          --latest=false                              \
          --generate-notes
